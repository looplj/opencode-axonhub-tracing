name: 功能请求 / Feature Request
description: 提出新功能或改进建议 / Suggest a feature or improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢提出功能建议！提交前请先搜索现有 issues，避免重复。
        Please search existing issues before submitting a duplicate.

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查 / Pre-submission Checklist
      options:
        - label: 我已搜索现有 issues，此功能尚未被提出 / I searched existing issues and this feature has not been requested
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述 / Problem Statement
      description: 当前有什么限制或使用痛点？/ What limitation or pain point does this address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案 / Proposed Solution
      description: 描述你希望实现的行为 / Describe the behavior you would like
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives Considered

  - type: dropdown
    id: category
    attributes:
      label: 功能分类 / Feature Category
      options:
        - Plugin hook / 插件 hook
        - Header behavior / Header 行为
        - OpenCode integration / OpenCode 集成
        - Configuration / 配置
        - Build or tooling / 构建或工具链
        - Documentation / 文档
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景 / Use Case
      description: 请提供具体的使用场景或配置示例 / Provide concrete usage scenarios or configuration examples

  - type: textarea
    id: additional
    attributes:
      label: 附加信息 / Additional Context
